[project]
name = "guava-sdk"
version = "0.41.0"
description = "The official Python SDK for building Guava voice agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.12.4",
    "typing-extensions>=4.15.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
lancedb = ["lancedb>=0.20.0"]
pgvector = ["psycopg[binary]>=3.2.0", "pgvector>=0.4.0", "numpy>=1.26.0"]
chromadb = ["chromadb>=0.6.0"]
pinecone = ["pinecone>=5.0.0"]
genai = ["google-genai>=1.55.0"]
openai = ["openai>=2.8.1"]
wakeword = ["nanowakeword>=2.1.0", "onnxruntime>=1.15.0,<=1.26.0", "pyaudio>=0.2.14"]

[dependency-groups]
dev = [
    "aiortc>=1.14.0",
    "fastapi>=0.128.0",
    "google-genai>=1.55.0",
    "mypy>=1.18.2",
    "numpy>=2.2.6",
    "openai>=2.8.1",
    "ruff>=0.16.1",
    "semgrep>=1.165.0",
    "simple503>=0.4.0",
    "sounddevice>=0.5.5",
    "ty>=0.0.43",
    "uvicorn>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guava"]
exclude = ["internal"]
artifacts = [
    "guava/models/**/*.onnx",
    "guava/webrtc-helper-manifest.json",
    "guava/examples/example-caller-audio.wav",
]

[tool.hatch.build.targets.sdist]
exclude = ["internal"]
only-include = ["guava", "pyproject.toml", "README.md"]

[tool.ty.analysis]
replace-imports-with-any = ["nanowakeword.**"]

# internal/ contains legacy examples that still use the deprecated CallController
# API; suppress deprecation warnings there.
[[tool.ty.overrides]]
include = ["internal/**"]

[tool.ty.overrides.rules]
deprecated = "ignore"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B006",    # mutable-argument-default
    "B008",    # function-call-in-default-argument
    "B023",    # function-uses-loop-variable
    "BLE001",  # blind-except
    "DTZ011",  # call-date-today
    "I001",    # unsorted-imports
    "ISC004",  # explicit-string-concatenation
    "PIE790",  # unnecessary-placeholder
    "PLE0604", # invalid-all-object
    "PLR1722", # sys-exit-alias
    "PLW0602", # global-variable-not-assigned
    "PLW1510", # subprocess-run-without-check
    "RUF012",  # mutable-class-default
    "RUF022",  # unsorted-dunder-all
    "RUF059",  # unused-unpacked-variable
    "RUF100",  # unused-noqa
    "S110",    # try-except-pass
    "SIM101",  # duplicate-isinstance-call
    "SIM102",  # collapsible-if
    "SIM118",  # in-dict-keys
    "TRY002",  # raise-vanilla-class
    "UP006",   # non-pep585-annotation
    "UP007",   # non-pep604-annotation-union
    "UP035",   # deprecated-import
    "UP037",   # quoted-annotation
    "UP045",   # non-pep604-annotation-optional
]
